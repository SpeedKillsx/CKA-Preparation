kind: ReplicationController
apiVersion: v1
metadata:
  name: nginx-rc
  labels:
    name: test-replication-controller
    version: 1.0.0
    type: demo
spec:
  replicas: 3
  template:
    metadata:
      name: nginx
      labels:
        name: nginx-replication
        type: demo
    spec:
      containers:
        - name: nginx-pod
          image: nginx:latest
          ports:
            - containerPort: 80
