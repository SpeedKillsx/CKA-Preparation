kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deploy
  labels:
    env: deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      env: deploy
  template:
    metadata:
      labels:
        env: deploy
    spec:
      containers:
        - image: nginx:latest
          name: nginx
          ports:
            - containerPort: 80

