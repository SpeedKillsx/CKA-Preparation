kind: ReplicationController
apiVersion: v1
metadata:
  name: nginx
  labels:
    name: demo-rc
spec:
  replicas: 3
  
  template:
    metadata:
      name: nginx
      labels:
        env: demo
        version: 1.0.0
        type: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
              hostPort: 8080
